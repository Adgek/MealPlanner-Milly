; Settings shared by the `app` and `scheduler` containers.
; The time zone comes from the TZ environment variable that compose sets, so the
; household zone is configured in one place (.env) rather than baked in here.

memory_limit = 512M
max_execution_time = 60

upload_max_filesize = 16M
post_max_size = 16M

expose_php = Off

; Keep errors in the container log; Laravel decides what the browser sees.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Local Docker is the dev environment as well, so pick up edited files.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
